<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">

<title>幻光典藏 · 全息卡畫廊</title>
<meta name="description" content="幻光典藏 — 可拖曳旋轉、隨視角流轉虹彩的互動全息卡收藏。">
<style>
  :root{--bg:#07090e;--panel:#0f141c;--gold:#d4b77c;--ink:#efe7d7;--muted:#8b9096;--line:#ffffff14;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#131a26 0%,var(--bg) 60%);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;min-height:100vh}
  header{max-width:1180px;margin:0 auto;padding:54px 6% 30px;text-align:center}
  .seal{display:inline-grid;place-items:center;width:56px;height:62px;border:1px solid #b69a61;border-radius:4px;
    color:var(--gold);font:38px "KaiTi","STKaiti",serif;transform:rotate(-5deg);margin-bottom:22px}
  h1{font-family:"KaiTi","STKaiti",serif;font-weight:400;font-size:clamp(34px,5vw,52px);letter-spacing:10px;margin:0 0 14px}
  .lead{color:var(--muted);font-size:14px;letter-spacing:3px;line-height:2;max-width:560px;margin:0 auto}
  .rule{width:52px;height:1px;background:var(--gold);margin:26px auto 0}
  main{max-width:1180px;margin:0 auto;padding:20px 6% 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:linear-gradient(180deg,#121826,#0c1017);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
  .card:hover{transform:translateY(-6px);border-color:#c2a36855;box-shadow:0 18px 46px #0009}
  .thumb{aspect-ratio:1024/1536;overflow:hidden;background:#05070b;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .card:hover .thumb img{transform:scale(1.045)}
  .thumb::after{content:"";position:absolute;inset:10px;border:1px solid #d4b77c40;border-radius:8px;pointer-events:none}
  .meta{padding:20px 22px 24px}
  .sub{font-family:"KaiTi","STKaiti",serif;color:#bbb19e;font-size:15px;letter-spacing:5px;margin:0 0 4px}
  .meta h2{font-family:"KaiTi","STKaiti",serif;font-weight:400;font-size:30px;letter-spacing:4px;margin:0 0 14px}
  .tech{font-size:12px;color:var(--gold);letter-spacing:3px;margin:0 0 18px;display:flex;align-items:center;gap:9px}
  .tech span{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg);display:inline-block}
  .enter{font-size:12px;color:#cbb689;letter-spacing:2px}
  footer{max-width:1180px;margin:0 auto;padding:0 6% 50px;text-align:center;color:#5a626d;font-size:11px;letter-spacing:2px;line-height:2.2}
  footer b{color:#7d838d;font-weight:400}
  @media(max-width:560px){header{padding-top:40px}h1{letter-spacing:6px}}
</style>
</head>
